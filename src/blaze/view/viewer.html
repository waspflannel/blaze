<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>blaze view</title>
<!-- Generated by blaze view. Self-contained: no network access needed. -->
<style>
:root { --bg:#fbfbfa; --panel:#fff; --fg:#1d1d1b; --muted:#6b6b66; --line:#e2e1dc; --in:#3b6fb6; --shift:#8a8a84;
  --sum:#2e7d4f; --out:#6a3fb5; --shared:#d9730d; --neg:#c0392b; --hl:#fff3c4; --edge:#b9b8b1; }
@media (prefers-color-scheme: dark) { :root { --bg:#161615; --panel:#1f1f1d; --fg:#ecebe6; --muted:#9a9993; --line:#33332f;
  --in:#7aa7e8; --shift:#8f8e88; --sum:#5cbf86; --out:#a98be6; --shared:#f0953a; --neg:#ef6f5e; --hl:#4a4220; --edge:#4b4a45; } }
* { box-sizing:border-box; }
body { margin:0; font:13px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--fg); height:100vh; display:flex; flex-direction:column; }
header { padding:10px 16px; border-bottom:1px solid var(--line); background:var(--panel); }
header h1 { font-size:15px; margin:0 0 6px; font-weight:600; }
header h1 span { color:var(--muted); font-weight:400; font-family:ui-monospace, monospace; font-size:12px; }
.stats { display:flex; flex-wrap:wrap; gap:6px 20px; }
.stats b { font-variant-numeric:tabular-nums; font-size:15px; display:block; }
.stats div { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
.stats div b { color:var(--fg); text-transform:none; letter-spacing:0; }
main { flex:1; display:flex; min-height:0; }
aside { width:330px; border-right:1px solid var(--line); display:flex; flex-direction:column; background:var(--panel); }
.tools { padding:8px; display:flex; gap:6px; border-bottom:1px solid var(--line); }
input[type=search] { flex:1; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
button { padding:4px 9px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); cursor:pointer; font:inherit; }
button:hover { border-color:var(--muted); }
#rows { flex:1; overflow:auto; }
table { border-collapse:collapse; width:100%; font-variant-numeric:tabular-nums; }
th { position:sticky; top:0; background:var(--panel); text-align:right; font-weight:500; color:var(--muted); padding:5px 8px; border-bottom:1px solid var(--line); cursor:pointer; user-select:none; }
th:first-child, td:first-child { text-align:left; }
td { text-align:right; padding:3px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
tr.row { cursor:pointer; }
tr.row:hover td { background:var(--hl); }
tr.open td:first-child { box-shadow:inset 3px 0 var(--out); font-weight:600; }
tr.sel td { background:var(--hl); }
.bar { display:inline-block; height:6px; background:var(--sum); opacity:.5; vertical-align:middle; margin-right:4px; border-radius:2px; }
#stage { flex:1; position:relative; overflow:hidden; }
#svg { width:100%; height:100%; cursor:grab; display:block; }
#svg.drag { cursor:grabbing; }
#empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); text-align:center; padding:24px; pointer-events:none; }
#info { position:absolute; right:12px; top:12px; width:320px; max-height:calc(100% - 24px); overflow:auto; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; box-shadow:0 2px 10px rgba(0,0,0,.08); display:none; }
#info h2 { font-size:14px; margin:0 0 6px; }
#info dl { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; margin:0 0 8px; }
#info dt { color:var(--muted); }
#info dd { margin:0; font-variant-numeric:tabular-nums; }
#info code { display:block; padding:6px; background:var(--bg); border:1px solid var(--line); border-radius:4px; word-break:break-all; font-size:11px; margin:4px 0; }
#info img { max-width:100%; max-height:320px; object-fit:contain; border:1px solid var(--line); border-radius:4px; background:#fff; }
.legend { position:absolute; left:12px; bottom:10px; display:flex; gap:12px; color:var(--muted); font-size:11px; background:var(--panel); padding:4px 8px; border-radius:6px; border:1px solid var(--line); }
.legend i { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; vertical-align:-1px; }
.zoom { position:absolute; left:12px; top:12px; display:flex; gap:4px; }
svg text { font:11px ui-monospace, monospace; fill:var(--fg); pointer-events:none; }
.edge { fill:none; stroke:var(--edge); stroke-width:1; }
.edge.neg { stroke:var(--neg); stroke-dasharray:3 2; }
.edge.hot { stroke:var(--out); stroke-width:1.6; }
.edge.neg.hot { stroke:var(--neg); }
.node { cursor:pointer; }
.node rect { stroke-width:1.2; }
.node.dim { opacity:.25; }
.node.picked rect { stroke-width:3; }
</style>
</head>
<body>
<header>
  <h1>blaze view <span id="file"></span></h1>
  <div class="stats" id="stats"></div>
</header>
<main>
  <aside>
    <div class="tools">
      <input type="search" id="q" placeholder="Search output row, e.g. 12 or y[12]">
      <button id="clear" title="Close every expanded row">Clear</button>
    </div>
    <div id="rows"></div>
  </aside>
  <div id="stage">
    <svg id="svg"><g id="vp"><g id="edges"></g><g id="nodes"></g></g></svg>
    <div id="empty">Click an output row on the left to expand its fan-in cone.<br>Click more rows to add them; nodes they share are drawn once.</div>
    <div class="zoom"><button id="fit" title="Fit to view">Fit</button><button id="zin">+</button><button id="zout">&minus;</button></div>
    <div class="legend">
      <span><i style="background:var(--in)"></i>input</span><span><i style="background:var(--shift)"></i>shift</span>
      <span><i style="background:var(--sum)"></i>add/sub</span><span><i style="background:var(--out)"></i>output</span>
      <span><i style="background:var(--shared)"></i>shared (&gt;1 output)</span><span style="color:var(--neg)">- - subtract</span>
    </div>
    <div id="info"></div>
  </div>
</main>
<script>
const D = /*BLAZE_DATA*/null;
const KIND = ['in', 'const', 'shift', 'sum', 'out'];
const COLOR = { in: 'var(--in)', const: 'var(--in)', shift: 'var(--shift)', sum: 'var(--sum)', out: 'var(--out)' };
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString();
const kindOf = v => KIND[D.kind[v]];
const ins = v => D.ins[v].map(e => ({ src: Math.abs(e) - 1, sign: Math.sign(e) }));
const S = D.stats;
const outByNode = new Map(D.outputs.map((o, k) => [o.id, k]));

$('file').textContent = D.file + ' (' + S.module + ')';
document.title = 'blaze view: ' + S.module;
$('stats').innerHTML = [['inputs', S.inputs], ['outputs', S.outputs], ['adders', S.adders],
  ['shared adders', S.shared_adders], ['max depth', S.max_depth], ['shared intermediates', S.intermediates], ['graph nodes', S.nodes]]
  .map(([k, v]) => `<div>${k}<b>${fmt(v)}</b></div>`).join('');

// ---- Overview: one table row per output ----
const open = new Set();   // expanded output indexes (into D.outputs)
let selected = null;      // output index whose cone is highlighted
let sortKey = 'index', sortDir = 1;
const maxAdders = Math.max(1, ...D.outputs.map(o => o.adders));
function renderRows() {
  const q = $('q').value.trim().toLowerCase().replace(/^y\[?|\]$/g, '');
  const list = D.outputs.map((o, k) => k)
    .filter(k => !q || String(D.outputs[k].index) === q || D.outputs[k].label.toLowerCase().includes(q))
    .sort((a, b) => sortDir * (D.outputs[a][sortKey] - D.outputs[b][sortKey]) || a - b);
  const cols = [['index', 'row'], ['adders', 'adders'], ['shared_adders', 'shared'], ['depth', 'depth'], ['nodes', 'nodes']];
  $('rows').innerHTML = '<table><thead><tr>' + cols.map(([k, t]) =>
    `<th data-k="${k}">${t}${sortKey === k ? (sortDir > 0 ? ' &uarr;' : ' &darr;') : ''}</th>`).join('') + '</tr></thead><tbody>' +
    list.map(k => { const o = D.outputs[k];
      return `<tr class="row${open.has(k) ? ' open' : ''}${selected === k ? ' sel' : ''}" data-k="${k}"><td>${o.label}</td>` +
        `<td><span class="bar" style="width:${Math.round(40 * o.adders / maxAdders)}px"></span>${fmt(o.adders)}</td>` +
        `<td style="color:${o.shared_adders ? 'var(--shared)' : 'inherit'}">${fmt(o.shared_adders)}</td><td>${o.depth}</td><td>${fmt(o.nodes)}</td></tr>`; }).join('') +
    '</tbody></table>' + (list.length ? '' : '<p style="padding:8px;color:var(--muted)">No output matches.</p>');
}
$('rows').addEventListener('click', e => {
  const th = e.target.closest('th');
  if (th) { const k = th.dataset.k; sortDir = sortKey === k ? -sortDir : (k === 'index' ? 1 : -1); sortKey = k; renderRows(); return; }
  const tr = e.target.closest('tr.row');
  if (!tr) return;
  const k = +tr.dataset.k;
  if (open.has(k) && selected === k) { open.delete(k); selected = open.size ? [...open].pop() : null; }
  else { open.add(k); selected = k; }
  draw(true); renderRows(); showOutput(selected);
});
$('q').addEventListener('input', renderRows);
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') { const tr = $('rows').querySelector('tr.row'); if (tr) tr.click(); } });
$('clear').onclick = () => { open.clear(); selected = null; draw(true); renderRows(); showOutput(null); };

// ---- Graph of the expanded cones ----
function cone(v) {
  const seen = new Set([v]), stack = [v];
  while (stack.length) for (const { src } of ins(stack.pop())) if (!seen.has(src)) { seen.add(src); stack.push(src); }
  return seen;
}
const NODE_W = 128, NODE_H = 22, GAP_X = 70, GAP_Y = 8;
let pos = new Map(), hot = new Set(), picked = null;
function layout(nodes) {
  // Columns by level (inputs left, outputs right); order each column by the mean row of its sources.
  const cols = new Map();
  for (const v of nodes) { const l = D.level[v]; if (!cols.has(l)) cols.set(l, []); cols.get(l).push(v); }
  const levels = [...cols.keys()].sort((a, b) => a - b);
  const y = new Map();
  for (const l of levels) {
    const col = cols.get(l);
    const key = v => { const s = ins(v).filter(e => y.has(e.src)); return s.length ? s.reduce((a, e) => a + y.get(e.src), 0) / s.length : v; };
    const keys = new Map(col.map(v => [v, key(v)]));
    col.sort((a, b) => keys.get(a) - keys.get(b) || a - b);
    col.forEach((v, i) => y.set(v, i));
  }
  // Back-sweep: pull sources toward the mean row of their users so fan-in is not one tall wall.
  const users = new Map();
  for (const v of nodes) for (const { src } of ins(v)) { if (!users.has(src)) users.set(src, []); users.get(src).push(v); }
  const tall = Math.max(...levels.map(l => cols.get(l).length));
  const p = new Map();
  for (const l of levels.slice().reverse()) {
    const col = cols.get(l), n = col.length;
    const want = col.map(v => { const u = (users.get(v) || []).filter(w => p.has(w));
      return u.length ? u.reduce((a, w) => a + p.get(w).y, 0) / u.length : (y.get(v) + 0.5) * (tall / n) * (NODE_H + GAP_Y); });
    const order = col.map((v, i) => i).sort((a, b) => want[a] - want[b] || a - b);
    let last = -Infinity;
    const got = [];
    for (const i of order) { got[i] = Math.max(want[i], last + NODE_H + GAP_Y); last = got[i]; }
    // Stacking only pushes down, so recenter the column on where its nodes wanted to be.
    const shift = col.reduce((a, v, i) => a + want[i] - got[i], 0) / n;
    col.forEach((v, i) => p.set(v, { x: levels.indexOf(l) * (NODE_W + GAP_X), y: got[i] + shift }));
  }
  return p;
}
function el(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent && parent.appendChild(e); return e; }
function draw(refit) {
  const nodes = new Set();
  for (const k of open) for (const v of cone(D.outputs[k].id)) nodes.add(v);
  if (nodes.size > 6000 && !confirm(`Drawing ${fmt(nodes.size)} nodes may be slow. Continue?`)) { open.delete(selected); selected = open.size ? [...open].pop() : null; return draw(refit); }
  hot = selected === null ? new Set() : cone(D.outputs[selected].id);
  pos = layout(nodes);
  const E = $('edges'), N = $('nodes');
  E.textContent = ''; N.textContent = '';
  $('empty').style.display = nodes.size ? 'none' : 'flex';
  for (const v of nodes) for (const { src, sign } of ins(v)) {
    const a = pos.get(src), b = pos.get(v), x1 = a.x + NODE_W, y1 = a.y + NODE_H / 2, x2 = b.x, y2 = b.y + NODE_H / 2, mx = (x1 + x2) / 2;
    el('path', { d: `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`,
      class: 'edge' + (sign < 0 ? ' neg' : '') + (hot.has(v) && hot.has(src) ? ' hot' : '') }, E);
  }
  for (const v of nodes) {
    const p = pos.get(v), k = kindOf(v), shared = D.users[v] > 1;
    const g = el('g', { class: 'node' + (hot.size && !hot.has(v) ? ' dim' : '') + (picked === v ? ' picked' : ''), transform: `translate(${p.x},${p.y})` }, N);
    g.dataset.v = v;
    el('rect', { width: NODE_W, height: NODE_H, rx: k === 'shift' ? 3 : 11, fill: 'var(--panel)',
      stroke: shared && k !== 'in' && k !== 'out' ? 'var(--shared)' : COLOR[k] }, g);
    el('rect', { width: 5, height: NODE_H, rx: 2, fill: COLOR[k] }, g);
    const t = el('text', { x: 10, y: 15 }, g);
    let label = D.label[v];
    if (k === 'sum' && /^(sum|add\/sub) \d+ terms$/.test(label)) label = (D.ins[v].some(e => e < 0) ? '± ' : '+ ') + D.ins[v].length + ' terms';
    t.textContent = label.length > 18 ? label.slice(0, 17) + '…' : label;
    if (shared) el('text', { x: NODE_W - 6, y: 15, 'text-anchor': 'end', style: 'fill:var(--shared)' }, g).textContent = '×' + D.users[v];
    el('title', {}, g).textContent = D.label[v];
  }
  if (refit) fit();
}

// ---- Pan / zoom ----
let view = { x: 20, y: 20, k: 1 };
const apply = () => $('vp').setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`);
function fit() {
  if (!pos.size) { view = { x: 20, y: 20, k: 1 }; return apply(); }
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const p of pos.values()) { x0 = Math.min(x0, p.x); y0 = Math.min(y0, p.y); x1 = Math.max(x1, p.x + NODE_W); y1 = Math.max(y1, p.y + NODE_H); }
  const r = $('svg').getBoundingClientRect(), k = Math.min(1.5, (r.width - 40) / (x1 - x0), (r.height - 60) / (y1 - y0));
  view = { k, x: (r.width - k * (x1 + x0)) / 2, y: (r.height - k * (y1 + y0)) / 2 }; apply();
}
function zoomAt(f, cx, cy) { const k = Math.min(8, Math.max(0.02, view.k * f)); view.x = cx - (cx - view.x) * k / view.k; view.y = cy - (cy - view.y) * k / view.k; view.k = k; apply(); }
$('svg').addEventListener('wheel', e => { e.preventDefault(); const r = $('svg').getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
let drag = null;
$('svg').addEventListener('pointerdown', e => { if (e.target.closest('.node')) return; drag = { x: e.clientX - view.x, y: e.clientY - view.y }; $('svg').classList.add('drag'); $('svg').setPointerCapture(e.pointerId); });
$('svg').addEventListener('pointermove', e => { if (drag) { view.x = e.clientX - drag.x; view.y = e.clientY - drag.y; apply(); } });
$('svg').addEventListener('pointerup', () => { drag = null; $('svg').classList.remove('drag'); });
$('fit').onclick = fit;
$('zin').onclick = () => { const r = $('svg').getBoundingClientRect(); zoomAt(1.25, r.width / 2, r.height / 2); };
$('zout').onclick = () => { const r = $('svg').getBoundingClientRect(); zoomAt(0.8, r.width / 2, r.height / 2); };

// ---- Info panel ----
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }
function showOutput(k) {
  picked = null;
  if (k === null) { $('info').style.display = 'none'; return; }
  const o = D.outputs[k], svg = D.schematic.svg.replace('{N}', o.index), cmd = D.schematic.command.replace('{N}', o.index);
  $('info').style.display = 'block';
  $('info').innerHTML = `<h2>${esc(o.label)}</h2><dl><dt>adders in cone</dt><dd>${fmt(o.adders)}</dd>` +
    `<dt>shared adders</dt><dd>${fmt(o.shared_adders)}</dd><dt>depth</dt><dd>${o.depth} adder levels</dd><dt>cone nodes</dt><dd>${fmt(o.nodes)}</dd></dl>` +
    `<b>Gate schematic</b><div style="color:var(--muted)">Render it once with the CLI (needs yosys and netlistsvg), then reload or open:</div>` +
    `<code>${esc(cmd)}</code><a href="${esc(svg)}" target="_blank">${esc(svg)}</a>` +
    `<div><img src="${esc(svg)}" alt="" onerror="this.remove()"></div>`;
}
function showNode(v) {
  const k = kindOf(v), src = ins(v), users = D.outputs.filter(o => cone(o.id).has(v));
  picked = v; draw(false);
  const terms = src.map(({ src, sign }) => (sign < 0 ? '- ' : '+ ') + D.label[src]).join(' ');
  $('info').style.display = 'block';
  $('info').innerHTML = `<h2>${esc(D.label[v])}</h2><dl><dt>kind</dt><dd>${k === 'sum' ? 'add/sub' : k}</dd>` +
    (k === 'shift' ? `<dt>shift</dt><dd>${D.shift[v] > 0 ? '<< ' + D.shift[v] : '>> ' + -D.shift[v]}</dd>` : '') +
    `<dt>adders</dt><dd>${D.adders[v]}</dd><dt>depth</dt><dd>${D.depth[v]}</dd><dt>used by</dt><dd>${users.length} output${users.length === 1 ? '' : 's'}</dd></dl>` +
    (src.length ? `<b>inputs</b><code>${esc(terms.slice(0, 2000))}${terms.length > 2000 ? ' …' : ''}</code>` : '') +
    (users.length ? `<b>outputs</b><code>${esc(users.slice(0, 200).map(o => o.label).join(' '))}${users.length > 200 ? ' …' : ''}</code>` : '') +
    (outByNode.has(v) ? '<button id="back">Row details</button>' : '');
  const b = $('back'); if (b) b.onclick = () => showOutput(outByNode.get(v));
}
$('nodes').addEventListener('click', e => { const g = e.target.closest('.node'); if (g) showNode(+g.dataset.v); });

renderRows();
apply();
</script>
</body>
</html>
